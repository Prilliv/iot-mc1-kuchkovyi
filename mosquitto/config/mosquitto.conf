# ===== Загальне =====
persistence true
persistence_location /mosquitto/data/

# Логи в stdout (docker compose logs mosquitto).
# debug увімкнено для навчання: видно "Denied PUBLISH" від ACL. У продакшені вимкнути.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type debug
connection_messages true
log_timestamp true

# ===== Безпека: автентифікація та авторизація =====
allow_anonymous false
password_file /tmp/mosquitto/passwd
acl_file /tmp/mosquitto/acl

# ===== Обмеження ресурсів (STRIDE: Denial of Service) =====
max_connections 100
message_size_limit 4096
max_queued_messages 200
max_inflight_messages 20

# ===== Єдиний слухач: MQTT поверх TLS =====
# Порт 1883 (відкритий MQTT) НЕ створюється взагалі.
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
